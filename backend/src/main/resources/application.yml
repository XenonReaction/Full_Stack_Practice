server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/guestbook
    username: guestbook
    password: guestbook
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  submission-passcode: ${APP_SUBMISSION_PASSCODE:let-me-in}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}